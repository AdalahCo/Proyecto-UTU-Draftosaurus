<!Doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Configuracion</title>
    </head>
    <header>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/config.css">
    </header>
    <body class="bg">
        <a href="../main.html"><img src="../img/back.png" id="backarw" class="d-none d-lg-block"></a>
        <a href="../main.html"><img src="../img/back.png" id="backarwSM" class="d-lg-none"></a>

        <select id="selectLang" hidden>
            <option value="es">Español</option>
            <option value="en">English</option>
        </select>

        <div id="sel" class="container">
            <div class="row">
                <img src="../img/español.png" data-lang="es" class="lang-flag" alt="Español">
            </div>
            <div class="row">
                <img src="../img/english.png" data-lang="en" class="lang-flag" alt="English">
            </div>
        </div>
        <div id="sel" class="container d-lg-none">
            <div class="row">
                <img src="../img/español.png" data-lang="es" class="lang-flag" alt="Español" id="imgSM">
            </div>
            <div class="row">
                <img src="../img/english.png" data-lang="en" class="lang-flag" alt="English" id="imgSM">
            </div>
        </div>
        <script src="../js/lang.js"></script>
    </body>
</html>
