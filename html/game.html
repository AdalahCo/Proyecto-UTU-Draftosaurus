<Doctype html>
<html lang="es">
    <head>
        <title>Game</title>
        <meta charset="UTF-8">
    </head>
    <header>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/game.css">
    </header>
    <body class="darkMode">
        <a class="btn btn-outline-warning col-2" role="button" id="fin">Finalizar</a>

        <div id="dinos-container" class="dinos-container">
            <div class="dino" draggable="true" data-dino="T-Rex">🦖 T-Rex</div>
            <div class="dino" draggable="true" data-dino="Velociraptor">🦕 Velociraptor</div>
            <div class="dino" draggable="true" data-dino="Triceratops">🦕 Triceratops</div>
            <div class="dino" draggable="true" data-dino="Stegosaurio">🦕 Stegosaurio</div>
            <div class="dino" draggable="true" data-dino="Spinosaurio">🦕 Spinosaurio</div>
            <div class="dino" draggable="true" data-dino="Anquilosaurio">🦕 Anquilosaurio</div>
        </div>

        <div class="tablero-container">
            <img src="../img/table.png" id="tablero">

            <div class="casilla" data-casilla="1" data-limite="6" data-original="Bosque de Semejanza">Bosque de Semejanza</div>
            <div class="casilla" data-casilla="2" data-limite="3" data-original="Trío Frondoso">Trío Frondoso</div>
            <div class="casilla" data-casilla="3" data-limite="8" data-original="Pradera del Amor">Pradera del Amor</div>
            <div class="casilla" data-casilla="4" data-limite="1" data-original="Rey de la Selva">Rey de la Selva</div>
            <div class="casilla" data-casilla="5" data-limite="6" data-original="Pradera de la Diferencia">Pradera de la Diferencia</div>
            <div class="casilla" data-casilla="6" data-limite="1" data-original="Isla Solitaria">Isla Solitaria</div>
            <div class="casilla" data-casilla="7" data-limite="12" data-original="Rio">Rio</div>
        </div>
        <script src="../js/game.js"></script>
    </body>
</html>
